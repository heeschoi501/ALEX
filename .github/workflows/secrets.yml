# 공개 저장소에 키·토큰·개인 키가 올라오지 않았는지 — 글만 바뀐 커밋도 포함해 모든 push 와 main 으로 가는 PR 에서,
# 저장소 역사 전체를 본다(작아서 1초 안팎). gitleaks 는 Go 모듈 체크섬 데이터베이스로 받은 그대로인지 확인되는 판을 쓴다.
name: secrets

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: install gitleaks v8.21.2
        run: go install github.com/zricethezav/gitleaks/v8@v8.21.2
      - name: scan the whole history
        run: "$(go env GOPATH)/bin/gitleaks git --config .gitleaks.toml --no-banner --redact --verbose ."
